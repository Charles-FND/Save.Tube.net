services:
  - type: web
    name: savetube-backend
    env: python
    region: frankfurt
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "cd backend && gunicorn server.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "savetube-backend.onrender.com,your-custom-domain.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-frontend-domain.vercel.app"
